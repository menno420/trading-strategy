# HOST-OWNED workflow — NOT regenerated by `bootstrap.py upgrade`.
# Why this file exists: merges landed by the auto-merge enabler use
# GITHUB_TOKEN, whose pushes never fire on:push workflows, so main gets
# no first-party CI runs between direct pushes. PR #133 fixed that by
# appending schedule/workflow_dispatch triggers directly to the kit-owned
# tests.yml and substrate-gate.yml — but substrate-gate.yml's own header
# says adopt/upgrade REGENERATES that file in place (hand edits are
# OVERWRITTEN) and that host customizations belong in a SEPARATE workflow
# file. This is that file: it owns the recurring-main-verification cron so
# a future kit bump can never silently strip it, and it mirrors the same
# verification the PR checks run (tests.yml's pytest job + the substrate
# gate's strict check via its no-card sentinel lane).
name: main-cron-verify
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      # Pin ref: main so scheduled AND manually dispatched runs always
      # verify main, regardless of which ref the dispatch was invoked on.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (mirrors tests.yml pytest job)
        run: python3 -m pytest -q
      - name: Substrate strict check (mirrors substrate-gate no-card lane)
        # Same invocation substrate-gate.yml uses when no session card is
        # in the diff: an explicitly named absent card is ADVISORY, while
        # a bare `check --strict` would fall back to newest-by-mtime card
        # selection — unreliable in CI, where checkout flattens mtimes.
        run: python3 bootstrap.py check --strict --session-log .sessions/__no-card-in-diff__.md
